name: CI

# Runs on every push and pull request. With Railway's "Wait for CI" enabled,
# a red run here blocks the deploy — broken code never reaches the girls.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, content, component, and server tests
        # The github-actions reporter surfaces each failure as an annotation on
        # the run, so a red build explains itself without opening the logs.
        run: npx vitest run --reporter=default --reporter=github-actions

      - name: Production build
        run: npm run build
