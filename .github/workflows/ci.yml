name: CI

# Runs on every push and pull request. With Railway's "Wait for CI" enabled,
# a red run here blocks the deploy — broken code never reaches the girls.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, content, component, and server tests
        # The github-actions reporter surfaces each failure as an annotation on
        # the run, so a red build explains itself without opening the logs.
        run: npx vitest run --reporter=default --reporter=github-actions

      - name: Production build
        run: npm run build

      # ---- End-to-end smoke: the built app, in a real browser, two sizes ----

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: npx playwright test

      - name: Upload e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          # A failure before the e2e step has no report; don't warn about it.
          if-no-files-found: ignore
